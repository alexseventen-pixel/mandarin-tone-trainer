services:
  - type: web
    name: mandarin-tone-trainer
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TONEPERFECT_API_KEY
        sync: false
      - key: CREPE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANKI_TOKEN
        sync: false
