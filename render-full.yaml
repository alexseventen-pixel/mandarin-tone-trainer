services:
  - type: web
    name: mandarin-tone-trainer
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TONEPERFECT_API_KEY
        sync: false
      - key: CREPE_URL
        fromService:
          type: pserv
          name: mandarin-tone-crepe
          property: hostport

  - type: pserv
    name: mandarin-tone-crepe
    runtime: python
    plan: 1c-2g
    buildCommand: pip install -r crepe_service/requirements.txt
    startCommand: python crepe_service/app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CREPE_MODEL
        value: tiny
