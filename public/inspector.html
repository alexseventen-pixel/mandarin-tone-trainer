<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Deck Inspector</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#f4f8fb,#eef6fb);color:#08003f;font-size:14px}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#fff;box-shadow:0 2px 14px rgba(8,0,63,.06);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0}header .sp{flex:1}
.btn{border:none;background:linear-gradient(135deg,#00cfff,#1676d2);color:#fff;border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(22,118,210,.25)}
.btn.red{background:#fff;color:#dc2626;box-shadow:inset 0 0 0 1.5px #fca5a5}.btn.red:hover{background:#fee2e2}
.btn.alt{background:#fff;color:#1676d2;box-shadow:inset 0 0 0 1.5px #b9d7ea}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.sm{padding:5px 9px;font-size:12px;border-radius:9px}
.wrap{display:flex;gap:16px;padding:16px;align-items:flex-start}
aside{width:270px;flex:none;position:sticky;top:70px}main{flex:1;min-width:0}
.box{background:#fff;border-radius:18px;box-shadow:0 6px 22px rgba(8,0,63,.07);padding:14px;margin-bottom:14px}
.muted{color:#7a8794}.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7a8794;margin:10px 0 6px}
.dk{display:block;width:100%;text-align:left;border:none;background:#f4f8fb;border-radius:10px;padding:8px 10px;margin:4px 0;cursor:pointer;font-size:13px;color:#08003f}.dk.on{background:#e0f2fe;box-shadow:inset 0 0 0 1.5px #7cc7f0}.dk small{display:block;color:#7a8794}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f4f8fb;border-radius:12px;padding:8px 12px}.stat b{font-size:18px;display:block}
.stat.bad b{color:#dc2626}.stat.ok b{color:#16a34a}
.grp{font-weight:700;font-size:16px;margin:18px 4px 8px}
.note{background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(8,0,63,.06);padding:12px;margin-bottom:12px}
.nh{display:flex;align-items:center;gap:10px}.nh .t{font-size:20px;font-weight:700}.nh .sp{flex:1}
.star{font-size:20px;cursor:pointer;border:none;background:none;color:#cbd5e1}.star.on{color:#f59e0b}
.mark{width:100%;border:1px solid #e2e8ed;border-radius:10px;padding:6px 8px;font:inherit;margin-top:6px;display:none}.note.starred .mark,.mark.has{display:block}
.flds{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:12.5px;margin-top:8px}.flds .k{color:#7a8794}.flds .v{max-height:90px;overflow:auto;word-break:break-word}
.imgs img{height:90px;border-radius:10px;margin:6px 6px 0 0}
.chip{display:inline-block;border-radius:8px;padding:1px 7px;font-size:11.5px;margin:1px 2px;background:#eef2f5}.chip.bad{background:#fee2e2;color:#b91c1c}.chip.warn{background:#fef3c7;color:#92400e}.chip.ok{background:#dcfce7;color:#15803d}.chip.ed{background:#e0f2fe;color:#0b6fa8}
.au{border-top:1px solid #eef2f5;padding:8px 0}.au .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.au .nm{font-weight:600;font-size:12.5px}
.wf{position:relative;height:64px;margin:6px 0;background:#f4f8fb;border-radius:10px;cursor:crosshair;user-select:none;touch-action:none}.wf canvas{width:100%;height:100%;display:block}
.prevs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
dialog{border:none;border-radius:18px;box-shadow:0 20px 60px rgba(8,0,63,.25);padding:14px;max-width:96vw}dialog::backdrop{background:rgba(8,0,63,.25)}
iframe.card{width:390px;height:720px;border:1px solid #e2e8ed;border-radius:14px;background:#fff}
#login{max-width:360px;margin:12vh auto}input[type=password],input[type=text],select{border:1px solid #d5e2ec;border-radius:10px;padding:8px 10px;font:inherit}
.anat{width:100%;border-collapse:collapse;font-size:13px}.anat td,.anat th{border-top:1px solid #eef2f5;padding:6px;text-align:left;vertical-align:middle}.anat th{font-size:11px;color:#7a8794;text-transform:uppercase;letter-spacing:.06em}.slot{cursor:pointer;border-radius:8px;padding:3px 6px;display:inline-block}.slot:hover{background:#e0f2fe}.slot img{height:44px;border-radius:8px;display:block}.slot.chg{box-shadow:inset 0 0 0 1.5px #7cc7f0;background:#f0f9ff}.hz{font-size:22px;font-weight:700}.note.excl{opacity:.75;background:#f8fafc}
.note{transition:transform .15s,box-shadow .15s,opacity .15s;cursor:pointer}.note.sel{transform:scale(1.015);box-shadow:0 14px 40px rgba(22,118,210,.28);outline:2px solid #1676d2;outline-offset:0;position:relative;z-index:2;opacity:1!important}main.hassel .note:not(.sel){opacity:.55}
#drawer{position:fixed;right:16px;top:70px;bottom:16px;width:330px;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 16px 50px rgba(8,0,63,.18);padding:14px;z-index:6;border-top:4px solid #1676d2}
body.drawer-on main{margin-right:346px}.dgrid{display:flex;gap:6px;flex-wrap:wrap}.drow{display:flex;gap:6px;align-items:center}.dname{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#anat tr[data-row]{cursor:pointer}#anat tr.selrow td{background:#e0f2fe}
.note:not(.sel) .au{display:none}.aux td{background:#f8fbfe;padding:4px 10px 10px}.aux .au{display:block!important}.kau{opacity:.85}
.piano{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}.tile{width:112px;height:132px;perspective:600px;cursor:pointer;position:relative}.tile .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}.tile.fl .in{transform:rotateY(180deg)}
.tile .f,.tile .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;box-shadow:0 4px 14px rgba(8,0,63,.12);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.tile .f img{width:100%;height:100%;object-fit:cover}.tile .b{transform:rotateY(180deg);background:#fffbeb}.tile .b .h{font-size:34px;font-weight:700}.tile .b .p{color:#7a8794}
.tile.on .f,.tile.on .b{box-shadow:0 0 0 3px #f59e0b}.ptxt{font-size:30px;color:#9aa7b4;align-self:center;padding:0 2px}.tile .pk{position:absolute;right:4px;top:4px;z-index:3;background:#fff;border:none;border-radius:8px;font-size:12px;padding:2px 5px;opacity:.85;cursor:pointer}
.filters label{margin-right:12px;font-size:13px}.hide{display:none!important}
</style></head><body>
<header><h1>🔎 Deck Inspector</h1><span class="muted" id="dname"></span><span class="sp"></span>
<button class="btn" id="rebuild" disabled title="Apply all your edits and download a ready-to-import Anki deck" style="font-size:15px;padding:10px 18px">⬇ Download deck (.apkg)</button><span style="position:relative"><button class="btn alt sm" id="more" title="More: JSON exports, import edits">⋯ More</button><div id="moremenu" class="hide" style="position:absolute;right:0;top:110%;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(8,0,63,.18);padding:8px;display:flex;flex-direction:column;gap:6px;z-index:20;min-width:240px"><label class="btn alt sm" id="impl">⬆ Import edits JSON…<input type="file" id="impf" accept=".json,application/json" style="display:none"></label><button class="btn alt sm" id="exp" disabled>Export edits & marks (JSON)</button><button class="btn alt sm" id="expa" disabled>Export for analysis (JSON)</button></div></span></header>
<div id="login" class="box"><b>Enter passcode</b><p class="muted">This tool is private. Deck files are only opened in your browser.</p>
<form id="lf"><input type="password" id="code" placeholder="Passcode" autocomplete="current-password" style="width:100%"><div style="margin-top:10px"><button class="btn">Unlock</button> <span id="lerr" style="color:#dc2626"></span></div></form></div>
<div class="wrap hide" id="app">
<aside><div class="box"><div class="sec" style="margin-top:0">Open a deck</div><input type="file" id="file" accept=".apkg,.colpkg"><div class="muted" style="font-size:12px;margin-top:6px">Any Anki .apkg (legacy collection.anki2/anki21). Parsed only in this browser.</div>
<div class="sec">Our decks</div><div id="decks" class="muted">Loading…</div></div></aside>
<main id="main"><div class="box muted">Pick a deck on the left or open an .apkg file.</div></main></div>
<div id="drawer" class="hide"></div>
<dialog id="dlg"><div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><b id="dt"></b><span style="flex:1"></span><button class="btn alt sm" onclick="dlg.close()">Close</button></div><div id="db"></div></dialog>
<script src="/inspector/lib/jszip.min.js"></script><script src="/inspector/lib/sql-wasm.js"></script><script src="/inspector/lib/lame.min.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let VARK={},VAR={},CLONE={enabled:false},TOKEN=sessionStorage.getItem('insp.t')||'',SQL,D=null,AC;
const api=(p,o={})=>fetch(p,{...o,headers:{...(o.headers||{}),'X-Insp-Token':TOKEN}});
$('lf').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/inspector/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value})});const j=await r.json();if(!r.ok){$('lerr').textContent=j.error;return;}TOKEN=j.token;sessionStorage.setItem('insp.t',TOKEN);start();};
async function start(){loadVariants();const r=await api('/api/inspector/decks');if(r.status===401){$('login').classList.remove('hide');return;}if(!r.ok){$('login').classList.remove('hide');$('lerr').textContent=(await r.json()).error;return;}
 $('login').classList.add('hide');$('app').classList.remove('hide');const j=await r.json();let g='';
 $('decks').innerHTML=j.decks.length?j.decks.map(d=>{const h=(d.group!==g?'<div class="sec">'+esc(g=d.group)+'</div>':'');return h+`<button class="dk" data-id="${d.id}">${esc(d.name)}<small>${(d.size/1048576).toFixed(1)} MB</small></button>`}).join(''):'No preloaded decks.';
 document.querySelectorAll('.dk').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.dk').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('main').innerHTML='<div class="box muted">Loading deck…</div>';const r=await api('/api/inspector/deck?id='+b.dataset.id);if(!r.ok){$('main').innerHTML='<div class="box">Could not load: '+esc((await r.json()).error)+'</div>';return;}openDeck(await r.arrayBuffer(),b.dataset.id+'.apkg',b.firstChild.textContent);});}
$('file').onchange=async e=>{const f=e.target.files[0];if(f)openDeck(await f.arrayBuffer(),f.name,f.name);};
if(TOKEN)start();
// ---------- parse ----------
async function openDeck(buf,file,title){
 SQL=SQL||await initSqlJs({locateFile:f=>'/inspector/lib/'+f});AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 const zip=await JSZip.loadAsync(buf);const cf=zip.file('collection.anki21')||zip.file('collection.anki2');
 if(!cf){$('main').innerHTML='<div class="box">This package uses the new Anki format (anki21b) which is not supported yet. Export it from Anki with “Support older Anki versions” ticked.</div>';return;}
 const db=new SQL.Database(new Uint8Array(await cf.async('uint8array')));
 const q=s=>{const r=db.exec(s)[0];return r?r.values.map(v=>Object.fromEntries(r.columns.map((c,i)=>[c,v[i]]))):[]};
 const col=q('select models,decks from col')[0],models=JSON.parse(col.models),decks=JSON.parse(col.decks);
 const notes=q('select id,guid,mid,flds,tags from notes order by id'),cards=q('select nid,ord,did from cards');
 let mmap={};try{mmap=JSON.parse(await zip.file('media').async('string'))}catch{}
 const media={};for(const[k,n] of Object.entries(mmap)){const z=zip.file(k);if(z)media[n]={zkey:k,bytes:await z.async('uint8array')};}
 for(const m of Object.values(media)){m.url=URL.createObjectURL(new Blob([m.bytes],{type:mime(m.name)}));}
 Object.entries(media).forEach(([n,m])=>m.name=n);
 D={db,cfName:cf.name,zip,file,title,models,decks,notes,cards,media,edits:{},fedits:{},excluded:new Set(),modelChanged:false,exStack:[],dropOrphans:false,newMedia:{},marks:JSON.parse(localStorage.getItem('insp.marks.'+file)||'{}'),info:{}};
 notes.forEach(n=>n.flds0=n.flds);$('dname').textContent=title;$('exp').disabled=$('rebuild').disabled=$('expa').disabled=false;
 $('main').innerHTML='<div class="box muted">Analysing audio…</div>';
 const auds=Object.keys(media).filter(n=>/\.(mp3|wav|ogg|m4a|aac|flac)$/i.test(n));
 for(const n of auds)D.info[n]=await analyse(n);
 render();}
function mime(n){return /\.mp3$/i.test(n)?'audio/mpeg':/\.wav$/i.test(n)?'audio/wav':/\.ogg$/i.test(n)?'audio/ogg':/\.m4a$/i.test(n)?'audio/mp4':/\.png$/i.test(n)?'image/png':/\.gif$/i.test(n)?'image/gif':/\.svg$/i.test(n)?'image/svg+xml':/\.webp$/i.test(n)?'image/webp':/\.jpe?g$/i.test(n)?'image/jpeg':'application/octet-stream'}
async function decodeBytes(b){return await AC.decodeAudioData(b.slice().buffer)}
async function analyse(n){const m=D.media[n];try{const ab=await decodeBytes(m.edited||m.bytes);m.ab=ab;return check(ab)}catch(e){m.ab=null;return{dur:0,flags:[['bad','undecodable']]}}}
function check(ab){const x=ab.getChannelData(0),sr=ab.sampleRate,d=x.length/sr,F=Math.round(sr/100),n=Math.floor(x.length/F),e=[];let sq=0,pk=0,clip=0;
 for(let i=0;i<x.length;i++){const a=Math.abs(x[i]);sq+=x[i]*x[i];if(a>pk)pk=a;if(a>.99)clip++;}
 for(let i=0;i<n;i++){let s=0;for(let k=i*F;k<(i+1)*F;k++)s+=x[k]*x[k];e.push(10*Math.log10(s/F+1e-18));}
 const rms=10*Math.log10(sq/x.length+1e-18),mx=Math.max(...e,-200),thr=mx-20,fl=[];
 const lead=e.findIndex(v=>v>mx-30)/100,tail=([...e].reverse().findIndex(v=>v>mx-30))/100;
 if(rms<-50||pk<.01)fl.push(['bad','SILENT']);else if(rms<-35)fl.push(['warn','very quiet']);
 if(d<.25)fl.push(['bad','too short']);if(clip>20)fl.push(['bad','clipped']);
 if(n>6&&pk>=.01){if((e[0]+e[1]+e[2])/3>thr)fl.push(['warn','cut-off start']);if((e[n-1]+e[n-2]+e[n-3])/3>thr)fl.push(['warn','cut-off end']);
  if(lead>.6)fl.push(['warn','lead silence '+lead.toFixed(1)+'s']);if(tail>.8)fl.push(['warn','tail silence '+tail.toFixed(1)+'s']);}
 return{dur:d,rms,pk,flags:fl}}
// ---------- render ----------
function fieldsOf(nt){return nt.flds.split('\x1f')}
function refs(v){const a=[],i=[];v.replace(/\[sound:([^\]]+)\]/g,(_,f)=>a.push(f));v.replace(/<img[^>]+src=["']?([^"' >]+)/gi,(_,f)=>i.push(decodeURIComponent(f)));return{a,i}}
function groupOf(nt){const blk=(nt.tags.match(/\bblock_(\w+)/)||[])[1];const c=D.cards.find(c=>c.nid===nt.id);const dn=c&&D.decks[c.did]?D.decks[c.did].name.replace(/\x1f/g,'::'):'Deck';return dn+(blk?' · Block '+blk:'')}
function render(){
 const auds=Object.keys(D.info),bad=auds.filter(n=>D.info[n].flags.some(f=>f[0]==='bad')),warn=auds.filter(n=>!bad.includes(n)&&D.info[n].flags.length);
 let h=`<div class="box"><div class="stats"><div class="stat"><b>${D.notes.length}</b>notes</div><div class="stat"><b>${D.cards.length}</b>cards</div><div class="stat"><b>${Object.keys(D.media).length}</b>media files</div><div class="stat"><b>${auds.length}</b>audio</div><div class="stat ${bad.length?'bad':'ok'}"><b>${bad.length}</b>broken audio</div><div class="stat ${warn.length?'bad':'ok'}" style="${warn.length?'':''}"><b style="color:${warn.length?'#d97706':'#16a34a'}">${warn.length}</b>warnings</div><div class="stat"><b>${Object.values(D.marks).filter(m=>m.star).length}</b>★ moments</div></div>
 <div class="filters" style="margin-top:10px"><label><input type="checkbox" id="fp"> only cards with audio problems</label><label><input type="checkbox" id="fs"> only ★</label><input type="text" id="fq" placeholder="search text…"></div>
 ${bad.length||warn.length?'<div class="sec">Audio report</div>'+[...bad,...warn].map(n=>`<div><b>${esc(n)}</b> ${(D.info[n].dur).toFixed(2)} s · ${D.info[n].flags.map(f=>`<span class="chip ${f[0]}">${esc(f[1])}</span>`).join('')}</div>`).join(''):''}</div>`;
 h=anatomy()+h;let g='';
 for(const nt of D.notes){const gr=groupOf(nt);if(gr!==g){g=gr;h+=`<div class="grp" style="display:flex;align-items:center;gap:8px">${esc(gr)}<button class="btn alt sm" data-addg="${nt.id}">+ Add card here</button></div>`;}
  if(D.excluded.has(nt.id)){h+=`<div class="note excl" data-nid="${nt.id}" data-g="${esc(nt.guid)}" data-p="0" data-t=""><div class="nh"><span class="t" style="text-decoration:line-through;color:#9aa7b4">${esc((fieldsOf(nt)[0]||'').replace(/<[^>]+>/g,'').slice(0,40))}</span><span class="chip bad">deleted from rebuild</span><span class="sp"></span><button class="btn alt sm" data-restore="${nt.id}">↺ Restore</button></div></div>`;continue;}
  const m=D.models[nt.mid]||{flds:[],tmpls:[]},F=fieldsOf(nt),all=F.join(' '),R=refs(all),title=(F[0]||'').replace(/<[^>]+>/g,'').slice(0,40);
  const mk=D.marks[nt.guid]||{},prob=R.a.some(a=>D.info[a]&&D.info[a].flags.length);
  h+=`<div class="note ${mk.star?'starred':''}" data-nid="${nt.id}" data-g="${esc(nt.guid)}" data-p="${prob?1:0}" data-t="${esc(all.replace(/<[^>]+>/g,' ').toLowerCase())}"><div class="nh"><span class="t">${esc(title)}</span><span class="muted">${esc(m.name||'')} · ${D.cards.filter(c=>c.nid===nt.id).length} cards</span><span class="sp"></span>${nt.added?'<span class="chip ed">new</span>':''}<button class="btn alt sm" data-edit="${nt.id}">✎ Edit fields</button><button class="btn alt sm" data-dup="${nt.id}">⧉ Duplicate</button><button class="btn alt sm" data-exclude="${nt.id}" title="Exclude this note and its cards from the rebuilt deck (reversible)">🗑 Exclude</button><button class="btn red sm" data-exclude="${nt.id}" title="Delete this note and its cards from the rebuilt deck (you can restore it)">🗑 Delete</button><button class="star ${mk.star?'on':''}" title="Mark a successful moment">★</button></div>
  <input class="mark ${mk.note?'has':''}" placeholder="What worked well here?" value="${esc(mk.note||'')}">
  <div class="imgs">${[...new Set(R.i)].map(i=>D.media[i]?`<img src="${D.media[i].url}" title="${esc(i)}">`:`<span class="chip bad">missing image ${esc(i)}</span>`).join('')}</div>
  <div class="prevs">${(m.tmpls||[]).map((t,i)=>`<button class="btn alt sm" data-pv="${nt.id}:${i}">👁 ${esc(t.name)}</button>`).join('')}<button class="btn alt sm" data-fl="1">Fields</button></div>
  <div class="flds hide">${(m.flds||[]).map((f,i)=>`<div class="k">${esc(f.name)}</div><div class="v">${esc((F[i]||'').slice(0,600))}</div>`).join('')}</div>
  ${R.a.length?`<div class="muted aucnt" style="font-size:12px;margin-top:6px">🔊 ${new Set(refs(effFlds(nt)).a).size} sound(s) · click the card to open its audio</div>`:''}${[...new Set(refs(effFlds(nt)).a)].map(a=>audioRow(a,nt)).join('')}</div>`;}
 $('main').innerHTML=h;wire();}
function audKind(nt,a){if(!nt)return '';const k=n=>refs(fv(nt,n)).a.includes(a);if(k('Audio'))return 'word audio';if(k('ExAudio'))return 'phrase audio';if(k('Keys')){const h=fv(nt,'Keys'),i=h.indexOf('[sound:'+a+']'),c=(h.slice(0,i).match(/class="kc">([^<]+)<\/span><span class="kp">([^<]+)/g)||[]).pop()||'';const mm=c.match(/>([^<]+)<\/span><span class="kp">([^<]+)/);return 'radical sound'+(mm?' '+mm[1]+' '+mm[2]:'')+' (from Keys)'}return 'audio'}
function audioRow(a,nt){const i=D.info[a],m=D.media[a];if(!m)return `<div class="au"><span class="chip bad">missing audio file ${esc(a)}</span></div>`;const kd=audKind(nt,a);
 return `<div class="au ${/radical/.test(kd)?'kau':''}" data-a="${esc(a)}"><div class="row"><span class="nm">🔊 ${kd?'<span class="chip '+(/radical/.test(kd)?'warn':'ed')+'">'+esc(kd)+'</span> ':''}${esc(a)}</span>${nt?`<button class="btn red sm" data-rma="${nt.id}|${esc(a)}" title="Remove this sound from this card (undo any time)">🗑 Delete</button>`:''}<span class="muted">${i.dur.toFixed(2)} s · ${isFinite(i.rms)?i.rms.toFixed(0):'—'} dB · peak ${(i.pk||0).toFixed(2)} · used by ${usage(a)} note(s)</span>${i.flags.map(f=>`<span class="chip ${f[0]}">${esc(f[1])}</span>`).join('')||'<span class="chip ok">ok</span>'}${m.edited?'<span class="chip ed">edited: '+esc(m.editNote)+'</span>':''}</div>

class Wave{constructor(box,ab,cb){this.box=box;this.cv=box.querySelector('canvas');this.ab=ab;this.cb=cb;this.sel=null;this.p=null;this.draw();

  const x=this.ab.getChannelData(0),n=Math.floor(w/3),st=Math.max(1,Math.floor(x.length/n)),D2=this.ab.duration;
  if(this.sel){g.fillStyle='rgba(0,207,255,.18)';g.fillRect(this.sel[0]/D2*w,0,(this.sel[1]-this.sel[0])/D2*w,h)}
  for(let i=0;i<n;i++){let m=0;for(let k=i*st;k<Math.min(x.length,(i+1)*st);k++){const a=Math.abs(x[k]);if(a>m)m=a}const bh=Math.max(2,m*(h-8));const t=i/n*D2;
   g.fillStyle=this.p!=null&&t<this.p?'#08003f':(this.sel&&t>=this.sel[0]&&t<=this.sel[1])?'#1676d2':'#7cb3e0';g.fillRect(i*3,(h-bh)/2,2,bh)}
  g.fillStyle='#9aa7b4';g.font='10px sans-serif';g.fillText(D2.toFixed(2)+' s',w-40,10)}

function fnames(nt){return ((D.models[nt.mid]||{}).flds||[]).map(f=>f.name)}
function fv(nt,n){const e=(D.fedits[nt.id]||{})[n];if(e!==undefined)return e;const i=fnames(nt).indexOf(n);return i<0?'':(fieldsOf(nt)[i]||'')}
